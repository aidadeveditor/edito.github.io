<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --text-xs: clamp(0.72rem, 0.66rem + 0.25vw, 0.82rem);
  --text-sm: clamp(0.82rem, 0.76rem + 0.3vw, 0.94rem);
  --text-base: clamp(0.94rem, 0.88rem + 0.25vw, 1.05rem);
  --text-lg: clamp(1.1rem, 0.98rem + 0.65vw, 1.4rem);
  --space-1:.25rem;--space-2:.5rem;--space-3:.75rem;--space-4:1rem;
  --space-5:1.25rem;--space-6:1.5rem;--space-8:2rem;--space-10:2.5rem;
  --radius-sm:.35rem;--radius-md:.5rem;--radius-lg:.75rem;--radius-xl:1rem;
  --transition:170ms cubic-bezier(0.16,1,0.3,1);
  --font-body:"Inter",system-ui,sans-serif;
  --font-display:"Instrument Serif",Georgia,serif;
  --sidebar-w:230px;
  --header-h:58px;
}
:root,[data-theme="light"]{
  --bg:#f7f6f2;--surface:#f9f8f5;--surface-2:#fbfbf9;
  --surface-off:#f2efe9;--divider:#dcd9d5;--border:#d0cdc6;
  --text:#26231b;--muted:#7a7974;--faint:#c0bdb8;
  --primary:#01696f;--primary-h:#0c4e54;
  --green:#437a22;
  --shadow-sm:0 1px 2px oklch(0.2 0.01 80/0.06);
  --shadow-md:0 4px 14px oklch(0.2 0.01 80/0.09);
}
[data-theme="dark"]{
  --bg:#171614;--surface:#1c1b19;--surface-2:#201f1d;
  --surface-off:#1d1c1a;--divider:#262523;--border:#393836;
  --text:#cdccca;--muted:#797876;--faint:#5a5957;
  --primary:#4f98a3;--primary-h:#227f8b;
  --green:#72b042;
  --shadow-sm:0 1px 2px oklch(0 0 0/0.2);
  --shadow-md:0 4px 14px oklch(0 0 0/0.3);
}
html{-webkit-font-smoothing:antialiased;scroll-behavior:smooth;}
body{min-height:100dvh;font-family:var(--font-body);font-size:var(--text-base);color:var(--text);background:var(--bg);line-height:1.6;}
button{cursor:pointer;background:none;border:none;font:inherit;color:inherit;}
a,button{transition:color var(--transition),background var(--transition),border-color var(--transition);}

/* ── Header ─────────────────────────────────────────── */
.app-header{
  background:var(--surface);border-bottom:1px solid oklch(from var(--text) l c h/0.1);
  padding:0 var(--space-8);height:var(--header-h);
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:var(--shadow-sm);position:sticky;top:0;z-index:100;
}
.app-header-left{display:flex;align-items:center;gap:var(--space-4);}
.app-logo{
  display:flex;align-items:center;gap:var(--space-2);
  font-family:var(--font-display);font-size:var(--text-lg);
  color:var(--primary);text-decoration:none;
}
.header-badge{
  font-size:var(--text-xs);background:oklch(from var(--primary) l c h/0.12);
  color:var(--primary);padding:2px var(--space-2);border-radius:var(--radius-sm);
  font-weight:700;letter-spacing:.05em;text-transform:uppercase;
}
.header-total{font-size:var(--text-xs);color:var(--muted);}
.theme-toggle{
  width:34px;height:34px;border-radius:var(--radius-md);
  display:flex;align-items:center;justify-content:center;
  color:var(--muted);border:1px solid oklch(from var(--text) l c h/0.1);
  background:var(--surface-off);
}
.theme-toggle:hover{color:var(--text);background:var(--divider);}

/* ── Layout ──────────────────────────────────────────── */
.app-body{display:flex;min-height:calc(100dvh - var(--header-h));}

/* ── Sidebar ─────────────────────────────────────────── */
.sidebar{
  width:var(--sidebar-w);flex-shrink:0;
  background:var(--surface);border-right:1px solid oklch(from var(--text) l c h/0.08);
  padding:var(--space-5) var(--space-3);
  position:sticky;top:var(--header-h);height:calc(100dvh - var(--header-h));
  overflow-y:auto;display:flex;flex-direction:column;gap:var(--space-3);
}
.search-box{position:relative;}
.search-box input{
  width:100%;padding:var(--space-2) var(--space-3) var(--space-2) 2rem;
  font:inherit;font-size:var(--text-sm);
  background:var(--surface-off);border:1px solid oklch(from var(--text) l c h/0.12);
  border-radius:var(--radius-md);color:var(--text);outline:none;
  transition:border-color var(--transition);
}
.search-box input:focus{border-color:oklch(from var(--primary) l c h/0.5);}
.search-box input::placeholder{color:var(--faint);}
.search-icon{position:absolute;left:.62rem;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none;}
.sidebar-label{
  font-size:calc(var(--text-xs) - 0.05rem);text-transform:uppercase;letter-spacing:.08em;
  font-weight:700;color:var(--faint);padding:0 var(--space-2);margin-top:var(--space-1);
}
.cat-btn{
  width:100%;text-align:left;display:flex;align-items:center;justify-content:space-between;
  gap:var(--space-2);padding:var(--space-2) var(--space-3);
  border-radius:var(--radius-md);font-size:var(--text-sm);color:var(--muted);
}
.cat-btn:hover{color:var(--text);background:var(--surface-off);}
.cat-btn.active{color:var(--primary);background:oklch(from var(--primary) l c h/0.09);font-weight:600;}
.cat-inner{display:flex;align-items:center;gap:var(--space-2);}
.cat-count{
  font-size:10px;font-weight:700;padding:1px 6px;border-radius:99px;
  background:oklch(from var(--text) l c h/0.08);color:var(--muted);min-width:22px;text-align:center;
}
.cat-btn.active .cat-count{background:oklch(from var(--primary) l c h/0.15);color:var(--primary);}

/* ── Main content ────────────────────────────────────── */
.main-content{flex:1;min-width:0;padding:var(--space-8);}
.content-header{
  margin-bottom:var(--space-6);display:flex;align-items:baseline;gap:var(--space-3);flex-wrap:wrap;
}
.content-title{font-family:var(--font-display);font-size:var(--text-lg);color:var(--text);}
.content-count{font-size:var(--text-sm);color:var(--muted);}

.templates-list{display:flex;flex-direction:column;gap:var(--space-8);}

/* ── Card ─────────────────────────────────────────────── */
.tcard{
  background:var(--surface);border:1px solid oklch(from var(--text) l c h/0.08);
  border-radius:var(--radius-xl);overflow:hidden;box-shadow:var(--shadow-md);
}
.tcard-header{
  padding:var(--space-4) var(--space-6);
  border-bottom:1px solid oklch(from var(--text) l c h/0.07);
  display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-4);
  background:var(--surface-2);
}
.tcard-meta{flex:1;min-width:0;}
.tcard-top{display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-1);flex-wrap:wrap;}
.tid{
  font-family:"ui-monospace","Cascadia Code",monospace;font-size:calc(var(--text-xs) - 0.02rem);
  color:var(--primary);background:oklch(from var(--primary) l c h/0.1);
  padding:2px var(--space-2);border-radius:var(--radius-sm);font-weight:600;white-space:nowrap;
}
.tcat-badge{
  font-size:10px;font-weight:600;padding:2px 8px;border-radius:99px;
  background:oklch(from var(--text) l c h/0.07);color:var(--muted);
  text-transform:uppercase;letter-spacing:.04em;
}
.ttitle{font-size:var(--text-base);font-weight:600;color:var(--text);}
.tdesc{font-size:var(--text-sm);color:var(--muted);margin-top:2px;}
.copy-btn{
  display:flex;align-items:center;gap:var(--space-2);font-size:var(--text-xs);
  font-weight:700;padding:var(--space-2) var(--space-4);border-radius:var(--radius-md);
  border:1px solid oklch(from var(--primary) l c h/0.3);
  color:var(--primary);background:oklch(from var(--primary) l c h/0.06);
  text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;flex-shrink:0;
}
.copy-btn:hover{background:oklch(from var(--primary) l c h/0.13);}
.copy-btn.copied{
  color:var(--green);
  border-color:oklch(from var(--green) l c h/0.35);
  background:oklch(from var(--green) l c h/0.08);
}

/* ── Card body ───────────────────────────────────────── */
.tsections{display:grid;grid-template-columns:1fr 1fr;}
@media(max-width:720px){.tsections{grid-template-columns:1fr;}}
.tsection{padding:var(--space-4) var(--space-6);}
.tsection+.tsection{border-left:1px solid oklch(from var(--text) l c h/0.07);}
@media(max-width:720px){.tsection+.tsection{border-left:none;border-top:1px solid oklch(from var(--text) l c h/0.07);}}
.slabel{
  font-size:var(--text-xs);text-transform:uppercase;letter-spacing:.08em;font-weight:700;
  color:var(--faint);margin-bottom:var(--space-3);display:flex;align-items:center;gap:var(--space-2);
}
.preview-area{
  background:#fff;border:1px solid oklch(from var(--text) l c h/0.1);
  border-radius:var(--radius-lg);padding:var(--space-4);min-height:80px;overflow:hidden;
}
[data-theme="dark"] .preview-area{background:#f9f8f5;color:#26231b;}
.code-block{
  background:var(--surface-off);border:1px solid oklch(from var(--text) l c h/0.1);
  border-radius:var(--radius-lg);padding:var(--space-4);
  overflow-x:auto;max-height:300px;overflow-y:auto;
}
.code-block pre{
  font-family:"ui-monospace","Cascadia Code","Fira Code",monospace;
  font-size:calc(var(--text-xs) - 0.02rem);line-height:1.75;color:var(--muted);
  white-space:pre-wrap;word-break:break-all;
}

/* ── Empty state ─────────────────────────────────────── */
.empty-state{
  text-align:center;padding:var(--space-10);color:var(--muted);font-size:var(--text-sm);
  background:var(--surface);border-radius:var(--radius-xl);border:1px dashed var(--border);
}

/* ── Mobile sidebar → top bar ────────────────────────── */
@media(max-width:680px){
  .app-body{flex-direction:column;}
  .sidebar{
    width:100%;height:auto;position:static;
    border-right:none;border-bottom:1px solid oklch(from var(--text) l c h/0.08);
    flex-direction:row;flex-wrap:nowrap;overflow-x:auto;padding:var(--space-2) var(--space-3);
    gap:var(--space-2);scrollbar-width:none;
  }
  .sidebar::-webkit-scrollbar{display:none;}
  .search-box,.sidebar-label{display:none;}
  .cat-btn{white-space:nowrap;flex-shrink:0;}
  .main-content{padding:var(--space-4);}
}
</style>
</head>

// ════════════════════════════════════════════════════════════
//  STATE
// ════════════════════════════════════════════════════════════
let currentCat = 'all';
let searchQuery = '';

// ════════════════════════════════════════════════════════════
//  HELPERS
// ════════════════════════════════════════════════════════════
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function previewCode(code) {
  return code
    // Remplace src="URL ..." → placeholder
    .replace(/\bsrc="URL(?:[^"]*)"/gi, `src="${PLACEHOLDER}"`)
    // Remplace src="" dans les balises img → placeholder
    .replace(/(<img\b[^>]*?)\bsrc=""([^>]*?>)/gi, `$1src="${PLACEHOLDER}"$2`)
    // Vide srcset pour éviter erreurs
    .replace(/\bsrcset="[^"]*"/gi, 'srcset=""')
    // Neutralise tous les href (nav. indésirable en aperçu)
    .replace(/\bhref="[^"]*"/gi, 'href="javascript:void(0)"');
}

function getCounts() {
  const c = { all: TEMPLATES.length };
  CATEGORIES.forEach(cat => {
    if (cat.id !== 'all')
      c[cat.id] = TEMPLATES.filter(t => t.category === cat.id).length;
  });
  return c;
}

// ════════════════════════════════════════════════════════════
//  RENDER SIDEBAR
// ════════════════════════════════════════════════════════════
function renderSidebar() {
  const counts = getCounts();
  const nav = document.getElementById('sidebar-nav');
  nav.innerHTML = CATEGORIES.map(c => `
    <button class="cat-btn${currentCat === c.id ? ' active' : ''}" data-cat="${c.id}">
      <span class="cat-inner">${c.icon} ${esc(c.label)}</span>
      <span class="cat-count">${counts[c.id] ?? 0}</span>
    </button>
  `).join('');
  nav.querySelectorAll('.cat-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentCat = btn.dataset.cat;
      renderSidebar();
      renderTemplates();
    });
  });
}

// ════════════════════════════════════════════════════════════
//  RENDER TEMPLATES
// ════════════════════════════════════════════════════════════
function renderTemplates() {
  const q = searchQuery.toLowerCase().trim();
  const filtered = TEMPLATES.filter(t => {
    const matchCat  = currentCat === 'all' || t.category === currentCat;
    const matchQ    = !q || t.title.toLowerCase().includes(q)
                         || t.id.toLowerCase().includes(q)
                         || t.desc.toLowerCase().includes(q);
    return matchCat && matchQ;
  });

  const catObj = CATEGORIES.find(c => c.id === currentCat);
  document.getElementById('content-title').textContent = catObj?.label ?? 'Tous';
  document.getElementById('content-count').textContent =
    filtered.length + ' template' + (filtered.length > 1 ? 's' : '');

  const list = document.getElementById('templates-list');

  if (!filtered.length) {
    list.innerHTML = '<div class="empty-state">Aucun template ne correspond à cette recherche.</div>';
    return;
  }

  list.innerHTML = filtered.map(t => {
    const catLabel = CATEGORIES.find(c => c.id === t.category)?.label ?? '';
    return `
    <div class="tcard" data-id="${esc(t.id)}">
      <div class="tcard-header">
        <div class="tcard-meta">
          <div class="tcard-top">
            <span class="tid">${esc(t.id)}</span>
            ${currentCat === 'all' ? `<span class="tcat-badge">${esc(catLabel)}</span>` : ''}
          </div>
          <h2 class="ttitle">${esc(t.title)}</h2>
          <p class="tdesc">${t.desc}</p>
        </div>
        <button class="copy-btn" data-copy="${esc(t.id)}" aria-label="Copier le code de ${esc(t.title)}">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          Copier
        </button>
      </div>
      <div class="tsections">
        <div class="tsection">
          <div class="slabel">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
            Aperçu
          </div>
          <div class="preview-area">${previewCode(t.code)}</div>
        </div>
        <div class="tsection">
          <div class="slabel">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
            Code HTML
          </div>
          <div class="code-block"><pre>${esc(t.code.trim())}</pre></div>
        </div>
      </div>
    </div>`;
  }).join('');

  // Boutons copier
  list.querySelectorAll('.copy-btn[data-copy]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.copy;
      const t  = TEMPLATES.find(x => x.id === id);
      if (!t) return;
      navigator.clipboard.writeText(t.code.trim()).then(() => {
        const orig = btn.innerHTML;
        btn.classList.add('copied');
        btn.innerHTML = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>\u00a0Copié !`;
        setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = orig; }, 2200);
      }).catch(() => {
        // Fallback
        const ta = document.createElement('textarea');
        ta.value = t.code.trim();
        ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        const orig = btn.innerHTML;
        btn.classList.add('copied');
        btn.innerHTML = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>\u00a0Copié !`;
        setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = orig; }, 2200);
      });
    });
  });
}

// ════════════════════════════════════════════════════════════
//  THEME TOGGLE
// ════════════════════════════════════════════════════════════
(function() {
  const root   = document.documentElement;
  const toggle = document.querySelector('[data-theme-toggle]');
  let theme = matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light';
  root.setAttribute('data-theme', theme);
  const moon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
  const sun  = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>';
  if (toggle) toggle.addEventListener('click', () => {
    theme = theme === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', theme);
    toggle.innerHTML = theme === 'dark' ? sun : moon;
  });
})();

// ════════════════════════════════════════════════════════════
//  SEARCH
// ════════════════════════════════════════════════════════════
document.getElementById('search-input').addEventListener('input', e => {
  searchQuery = e.target.value;
  renderTemplates();
});

// ════════════════════════════════════════════════════════════
//  TOTAL DANS LE HEADER
// ════════════════════════════════════════════════════════════
document.getElementById('header-total').textContent = TEMPLATES.length + ' templates';

// ════════════════════════════════════════════════════════════
//  INIT
// ════════════════════════════════════════════════════════════
renderSidebar();
renderTemplates();
</script>
